[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-story-runtime-agent"
version = "0.1.0"
description = "Isolated local runtime agent for AI Story"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["runtime_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "offline_tests"]
pythonpath = ["."]
