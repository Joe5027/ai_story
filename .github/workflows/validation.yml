name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: AI workspace contract
        run: node scripts/validate-ai-harness.cjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Backend Django check
        working-directory: backend
        run: uv run python manage.py check

      - name: Backend SSE, ASGI, and Celery contract tests
        working-directory: backend
        run: >
          uv run python manage.py test
          apps.projects.tests.test_celery_contract
          apps.projects.tests.test_sse_views
          apps.projects.tests.test_asgi_sse

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Vue 2 compatibility audit
        working-directory: frontend
        run: npm run audit:vue2

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Authenticated browser smoke
        working-directory: frontend
        run: npm run smoke:auth
